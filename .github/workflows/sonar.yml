name: Build y análisis SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build, pruebas, JaCoCo y Sonar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-billing-engine
    steps:
      # Las actions van fijadas al SHA del commit de su release (githubactions:S7637).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: Sonar lo usa para el blame y el codigo nuevo.
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build, pruebas, cobertura y análisis
        env:
          # El token vive en los secretos del repositorio, nunca en el codigo.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build jacocoTestReport sonar
